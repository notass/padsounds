name: Android APK

on:
  push:
  workflow_dispatch:

env:
  SDL_VER: "2.30.9"
  MIXER_VER: "2.8.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Descargar SDL2 y SDL2_mixer
        run: |
          mkdir -p dl && cd dl
          curl -fsSL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL2-${SDL_VER}.tar.gz"
          curl -fsSL -o mixer.tgz "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${MIXER_VER}/SDL2_mixer-${MIXER_VER}.tar.gz"
          tar xzf sdl.tgz
          tar xzf mixer.tgz

      - name: Montar proyecto Android
        run: |
          P=android-build
          cp -r "dl/SDL2-${SDL_VER}/android-project" "$P"
          cp -r "dl/SDL2-${SDL_VER}" "$P/app/jni/SDL"
          rm -rf "$P/app/jni/SDL/android-project"
          cp -r "dl/SDL2_mixer-${MIXER_VER}" "$P/app/jni/SDL_mixer"
          (cd "$P/app/jni/SDL_mixer" && ./external/download.sh)

          # Codigo de la app
          mkdir -p "$P/app/jni/src"
          cp android/jni_src_Android.mk "$P/app/jni/src/Android.mk"
          cp main.c "$P/app/jni/src/main.c"

          # Sonidos dentro del APK + indice
          mkdir -p "$P/app/src/main/assets/sounds"
          cp sounds/*.wav "$P/app/src/main/assets/sounds/"
          (cd sounds && ls *.wav | sort > "../$P/app/src/main/assets/sounds/index.txt")

          # Nombre de paquete, minSdk y nombre de la app
          sed -i 's/applicationId "org.libsdl.app"/applicationId "com.notappss.padsounds"/' "$P/app/build.gradle"
          sed -i 's/minSdkVersion 19/minSdkVersion 21/' "$P/app/build.gradle"
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Pad Sounds</string>|' "$P/app/src/main/res/values/strings.xml"

          # Cargar SDL2_mixer antes de main
          sed -i 's|// *"SDL2_mixer",|"SDL2_mixer",|' "$P/app/src/main/java/org/libsdl/app/SDLActivity.java"

      - name: Compilar APK (debug)
        working-directory: android-build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: padsounds-apk
          path: android-build/app/build/outputs/apk/debug/*.apk
