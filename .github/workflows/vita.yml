name: PS Vita VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Listar librerias del SDK (para depurar)
        run: ls /usr/local/vitasdk/arm-vita-eabi/lib | grep -Ei 'sdl|opus|xmp|modplug|vorbis|ogg|mpg123|flac|vita|shark|neon|shacc' || true

      - name: Compilar
        run: |
          cmake -B build-vita
          cmake --build build-vita

      - uses: actions/upload-artifact@v4
        with:
          name: padsounds-vpk
          path: build-vita/padsounds.vpk
